<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Total Inspections | Media Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#162b33;--orange:#f15b29;--green:#3fb37f;--body:"Manrope","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);cursor:none}

/* fixed 1600x900 (16:9) canvas, scaled to fit any screen */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;font-family:var(--body);
  background:
    radial-gradient(ellipse 700px 420px at 92% 6%,rgba(241,91,41,.20),transparent 70%),
    radial-gradient(ellipse 800px 500px at 4% 100%,rgba(30,110,130,.22),transparent 70%),
    var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px}
.brand{position:absolute;left:48px;top:30px;height:36px;mix-blend-mode:lighten}

/* browser window */
.win{position:absolute;left:48px;top:92px;width:902px;height:703px;border-radius:13px;background:#fff;overflow:hidden;box-shadow:0 40px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.bar{height:34px;background:#eceff3;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #d9dee5;z-index:10;position:relative}
.bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{flex:1;margin-left:14px;height:20px;border-radius:10px;background:#fff;color:#6b7686;font-size:11px;line-height:20px;padding:0 12px;transition:all 0.3s ease}
.view{height:669px;overflow:hidden;position:relative;background:#fff}

/* desktop screens stack */
.desk-sc{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;opacity:0;background:#fff;will-change:opacity}
.desk-wrap{width:100%;position:relative;container-type:inline-size;will-change:transform}
.desk-wrap>img{display:block;width:100%;height:auto}

/* live graph in the d1 dashboard empty bottom strip */
.graph{position:absolute;left:25%;top:88%;width:47.4%;height:10.6%;background:#fff;border-radius:2.4cqw;box-shadow:0 .8cqw 3cqw rgba(15,40,90,.16);
  display:grid;grid-template-columns:27% 31% 1fr;align-items:center;gap:1.6cqw;padding:0 2.4cqw;color:#14213d}
.g-stats{display:grid;gap:.9cqw}
.g-stats small{display:block;font-size:1.05cqw;color:#6b7686;font-weight:500;line-height:1.1}
.g-stats b{display:block;font-size:3cqw;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.graph svg{width:100%;height:76%;display:block;overflow:visible}
.b{fill:#0b57a4;transform-box:fill-box;transform-origin:50% 100%;transition:transform 0.1s ease-out}
.b.hot{fill:var(--orange)}
.line{fill:none;stroke:var(--orange);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

/* integrations */
.links{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
.chip{position:absolute;left:1350px;width:176px;height:54px;border-radius:12px;background:rgba(30,56,66,.96);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:12px;padding:0 14px;color:#fff;font-weight:700;font-size:17px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.chip em{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--orange);display:grid;place-items:center;font-size:14px}

/* phone */
.phone{position:absolute;left:952px;top:186px;width:298px;height:590px;transform:rotate(-2.5deg);border-radius:40px;background:#060d13;padding:16px 8px 8px;display:flex;
  box-shadow:0 40px 70px -20px rgba(0,0,0,.75),0 0 0 1.5px rgba(255,255,255,.14)}
.phone::before{content:"";position:absolute;top:5px;left:50%;width:70px;height:8px;margin-left:-35px;border-radius:5px;background:#1b2731}
.screen{flex:1;border-radius:30px;overflow:hidden;background:#dde7f5;position:relative}
.sc{position:absolute;inset:0;overflow:hidden;opacity:0;background:#dde7f5}

/* ZOOM IN MODIFICATION: 108% width for a slight zoom */
.sc img{display:block;width:108%;margin-left:-4%;height:auto;will-change:transform}

.sent{position:absolute;inset:0;background:rgba(9,25,38,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;opacity:0}
.sent span{width:74px;height:74px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:40px;margin-bottom:16px}
.sent b{font-size:22px}
.sent small{margin-top:6px;color:#b9c9d1;font-size:13px;line-height:1.4}

/* toasts */
.toast{position:absolute;height:58px;border-radius:12px;background:#fff;color:#14213d;display:flex;align-items:center;gap:12px;padding:0 16px 0 12px;box-shadow:0 18px 36px -14px rgba(0,0,0,.6);opacity:0}
.toast i{font-style:normal;width:32px;height:32px;border-radius:9px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}
.toast b{display:block;font-size:14px;line-height:1.2}
.toast small{display:block;font-size:11.5px;color:#6b7686}
#t1{left:640px;top:24px;width:300px}
#t2{left:48px;top:822px;width:330px}#t2 i{background:#2a4652}
#t3{left:1180px;top:822px;width:310px}#t3 i{background:var(--green)}
</style>
</head>
<body>
<div id="stage">
  <img class="brand" src="images/logo.png" alt="Media Clock">

  <div class="win">
    <div class="bar"><i></i><i></i><i></i><div class="url" id="url-bar">app.totalinspections.com.au/dashboard</div></div>
    <div class="view" id="desk-view">
      <!-- 4 Desktop screens cycling smoothly -->
      <div class="desk-sc" id="dsc4">
        <div class="desk-wrap"><img src="images/d4.png" alt="Inspection Archive"></div>
      </div>
      <div class="desk-sc" id="dsc3">
        <div class="desk-wrap"><img src="images/d3.png" alt="Branding Identity"></div>
      </div>
      <div class="desk-sc" id="dsc2">
        <div class="desk-wrap"><img src="images/d2.png" alt="Template Management"></div>
      </div>
      <div class="desk-sc" id="dsc1" style="opacity: 1;">
        <div class="desk-wrap">
          <img src="images/d1.png" alt="Dashboard overview">
          <div class="graph">
            <div class="g-stats">
              <div><small>Jobs completed</small><b id="jobs">0</b></div>
              <div><small>Revenue (MTD)</small><b id="rev">$0.0k</b></div>
            </div>
            <svg viewBox="0 0 138 60" aria-hidden="true">
              <rect class="b" x="0"   width="14" y="33" height="27" rx="2"/>
              <rect class="b" x="20"  width="14" y="22" height="38" rx="2"/>
              <rect class="b" x="40"  width="14" y="35" height="25" rx="2"/>
              <rect class="b" x="60"  width="14" y="17" height="43" rx="2"/>
              <rect class="b" x="80"  width="14" y="25" height="35" rx="2"/>
              <rect class="b hot" x="100" width="14" y="6" height="54" rx="2"/>
              <rect class="b" x="120" width="14" y="30" height="30" rx="2"/>
            </svg>
            <svg viewBox="0 0 200 60" aria-hidden="true">
              <defs>
                <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#f15b29" stop-opacity=".35"/>
                  <stop offset="1" stop-color="#f15b29" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path id="area" fill="url(#fill)"/>
              <path id="ln" class="line"/>
              <circle id="live-dot" r="3.5" fill="#f15b29"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <svg class="links" id="links" viewBox="0 0 1600 900"></svg>
  <div class="chip" style="top:191px"><em>X</em>Xero</div>
  <div class="chip" style="top:313px"><em>C</em>CRM</div>
  <div class="chip" style="top:438px"><em>S</em>Stripe</div>
  <div class="chip" style="top:563px"><em>{}</em>Your API</div>

  <div class="phone">
    <div class="screen" id="screen">
      <div class="sc" id="sc5"><img src="images/m5-pdf.png" alt="PDF is generated"></div>
      <div class="sc" id="sc4"><img src="images/m4-summary.png" alt="Inspection summary and report"></div>
      <div class="sc" id="sc3"><img src="images/m3-findings.png" alt="Findings: plumbing"></div>
      <div class="sc" id="sc2"><img src="images/m2-property.png" alt="Property details"></div>
      <div class="sc" id="sc1" style="opacity: 1;"><img src="images/m1-home.png" alt="Inspector home"></div>
      <div class="sent" id="sent"><span>&#10003;</span><b>Report sent</b><small>PDF emailed to client<br>Dashboard updated</small></div>
    </div>
  </div>

  <div class="toast" id="t1"><i>+</i><div><b>New booking received</b><small>Auto-assigned to Field team A</small></div></div>
  <div class="toast" id="t2"><i>&#9881;</i><div><b>Quote #318 auto-generated</b><small>Sent for approval</small></div></div>
  <div class="toast" id="t3"><i>&#10003;</i><div><b>Invoice synced to Xero</b><small>No double entry</small></div></div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)},
      stage=$('stage'),deskView=$('desk-view'),urlBar=$('url-bar'),screen=$('screen'),sent=$('sent'),links=$('links'),
      ln=$('ln'),area=$('area'),dot=$('live-dot'),jobs=$('jobs'),rev=$('rev'),bars=[].slice.call(document.querySelectorAll('.b'));

  /* ---------- TIMELINE (seconds) ---------- */
  var T=20; // total loop length

  // 4 Desktop screens cycling throughout the story
  var DESK_SCREENS=[
    {id:'dsc1', url:'app.totalinspections.com.au/dashboard', fade:[-1, 0, 4.6, 5.2], scroll:[0.5, 4.2]},
    {id:'dsc2', url:'app.totalinspections.com.au/templates', fade:[4.6, 5.2, 9.6, 10.2], scroll:[5.2, 9.2]},
    {id:'dsc3', url:'app.totalinspections.com.au/branding',  fade:[9.6, 10.2, 14.6, 15.2], scroll:[10.2, 14.2]},
    {id:'dsc4', url:'app.totalinspections.com.au/reports',   fade:[14.6, 15.2, 19.4, 19.9], scroll:[15.2, 18.8]}
  ];

  // 5 Mobile screens cycling smoothly
  var SCREENS=[
    {id:'sc1',fade:[-1,0,3.4,3.9],     scroll:[0.6,3.2]},   // home
    {id:'sc2',fade:[3.4,3.9,7.2,7.7],  scroll:[4.0,7.0]},   // property
    {id:'sc3',fade:[7.2,7.7,11.0,11.5],scroll:[7.8,10.8]},  // findings
    {id:'sc4',fade:[11.0,11.5,14.8,15.3],scroll:[11.6,14.6]},// summary
    {id:'sc5',fade:[14.8,15.3,19.4,19.9],scroll:[15.4,16.9]}// pdf generated
  ];

  var SENT=[17.4,17.8,19.2,19.7];                 // "Report sent" overlay
  var TOAST1=[1.7,2.0,4.4,4.8];                   // New booking received
  var TOAST2=[12.5,12.9,18.8,19.4];               // Quote #318 auto-generated
  var TOAST3=[17.9,18.3,19.0,19.6];               // Invoice synced to Xero
  var GRAPH_BUILD=[0.2,3.2], GRAPH_DRAIN=[18.6,19.8];

  DESK_SCREENS.forEach(function(s){s.el=$(s.id);s.wrap=s.el.querySelector('.desk-wrap');s.img=s.el.querySelector('img')});
  SCREENS.forEach(function(s){s.el=$(s.id);s.img=s.el.querySelector('img')});

  function fit(){var s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform='translate(-50%,-50%) scale('+s+')'}
  addEventListener('resize',fit);fit();

  /* dotted connectors phone -> integrations, with travelling dots */
  var NS='http://www.w3.org/2000/svg',ox=1254,oy=480,cy=[218,340,465,590],dots=[];
  cy.forEach(function(y){
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',ox);l.setAttribute('y1',oy);l.setAttribute('x2',1348);l.setAttribute('y2',y);
    l.setAttribute('stroke','rgba(255,255,255,.28)');l.setAttribute('stroke-width','1.6');l.setAttribute('stroke-dasharray','2 6');l.setAttribute('stroke-linecap','round');
    links.appendChild(l);
    var e=document.createElementNS(NS,'circle');e.setAttribute('cx',1348);e.setAttribute('cy',y);e.setAttribute('r',4.5);e.setAttribute('fill','#f15b29');links.appendChild(e);
    var d=document.createElementNS(NS,'circle');d.setAttribute('r',4);d.setAttribute('fill','#f15b29');links.appendChild(d);
    dots.push({el:d,y:y});
  });

  /* ---------- helpers ---------- */
  var c=function(x){return x<0?0:x>1?1:x},
      p=function(t,a,b){return c((t-a)/(b-a))},
      ease=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
      soft=function(x){return x*x*(3-2*x)},
      out=function(x){return 1-Math.pow(1-x,3)},
      win=function(t,w){return c((t-w[0])/(w[1]-w[0]))*(1-c((t-w[2])/(w[3]-w[2])))};
  function toast(id,w,t){var a=win(t,w),e=$(id);e.style.opacity=a.toFixed(3);e.style.transform='translateY('+((1-a)*12).toFixed(1)+'px)'}

  function measure(){
    var vH = deskView.clientHeight;
    DESK_SCREENS.forEach(function(s){s.max=Math.max(0,s.wrap.offsetHeight-vH)});
    SCREENS.forEach(function(s){s.max=Math.max(0,s.img.offsetHeight-screen.clientHeight)});
  }

  // Live graph coordinates for d1 dashboard
  var lineBase = [[0,44],[22,38],[44,42],[66,28],[88,32],[110,18],[132,22],[154,10],[176,14],[200,6]];

  function frame(t){
    /* 1. Desktop screens transition & scroll */
    var activeUrl = DESK_SCREENS[0].url;
    var maxOpacity = 0;

    DESK_SCREENS.forEach(function(s, i){
      var o = win(t, s.fade);
      if(i === 0) o = c(o + c((t - 19.4) / .6)); // dsc1 fades back in at loop end
      s.el.style.opacity = o.toFixed(3);

      if(o > maxOpacity){
        maxOpacity = o;
        activeUrl = s.url;
      }

      var sd = ease(p(t, s.scroll[0], s.scroll[1]));
      s.wrap.style.transform = 'translateY(' + (-sd * s.max).toFixed(1) + 'px)';
    });

    if(urlBar.textContent !== activeUrl){
      urlBar.textContent = activeUrl;
    }

    /* 2. Live graph animation on Dashboard (d1) */
    var v = out(p(t, GRAPH_BUILD[0], GRAPH_BUILD[1])) * (1 - ease(p(t, GRAPH_DRAIN[0], GRAPH_DRAIN[1])));
    
    bars.forEach(function(b, i){
      var barScale = c(v * 1.6 - i * .09);
      if(v > 0.8) barScale += Math.sin(t * 3 + i) * 0.03;
      b.style.transform = 'scaleY(' + c(barScale).toFixed(3) + ')';
    });

    var currentPts = lineBase.map(function(pt, i){
      var wave = Math.sin(t * 2.2 + i * 0.8) * 2.5 * v;
      return [pt[0], Math.max(3, Math.min(57, pt[1] + wave))];
    });

    var pathD = 'M' + currentPts.map(function(pt){ return pt[0] + ' ' + pt[1].toFixed(1); }).join(' L');
    var areaD = pathD + ' V60 H0 Z';
    
    ln.setAttribute('d', pathD);
    area.setAttribute('d', areaD);
    area.style.opacity = v.toFixed(3);

    var endPt = currentPts[currentPts.length - 1];
    dot.setAttribute('cx', endPt[0]);
    dot.setAttribute('cy', endPt[1]);
    dot.setAttribute('opacity', (v * (0.8 + Math.sin(t * 6) * 0.2)).toFixed(2));

    jobs.textContent = Math.round(128 * v);
    rev.textContent = '$' + (48.2 * v).toFixed(1) + 'k';

    /* 3. Phone screens transition & scroll */
    SCREENS.forEach(function(s, i){
      var o = win(t, s.fade);
      if(i === 0) o = c(o + c((t - 19.4) / .6)); // home fades back in for seamless loop
      s.el.style.opacity = o.toFixed(3);
      var f = (i === 0 && t > 4) ? 0 : soft(p(t, s.scroll[0], s.scroll[1]));
      s.img.style.transform = 'translateY(' + (-f * s.max).toFixed(1) + 'px)';
    });
    sent.style.opacity = win(t, SENT).toFixed(3);

    /* 4. Toasts + connector dots */
    toast('t1', TOAST1, t);
    toast('t2', TOAST2, t);
    toast('t3', TOAST3, t);

    dots.forEach(function(d, i){
      var u = ((t * .55 + i * .27) % 1);
      d.el.setAttribute('cx', (ox + (1348 - ox) * u).toFixed(1));
      d.el.setAttribute('cy', (oy + (d.y - oy) * u).toFixed(1));
      d.el.setAttribute('opacity', Math.sin(u * Math.PI).toFixed(2));
    });
  }

  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = 0;
  function restart(){t0 = performance.now()}
  function tick(now){
    frame(still ? 5 : ((now - t0) / 1000) % T);
    requestAnimationFrame(tick);
  }

  // START IMMEDIATELY at t = 0 simultaneously for both screens
  measure();
  restart();
  requestAnimationFrame(tick);

  // Recalculate measurements as assets finish loading
  var allImgs = DESK_SCREENS.map(function(s){return s.img}).concat(SCREENS.map(function(s){return s.img}));
  allImgs.forEach(function(im){
    if(!im.complete) im.onload = measure;
  });
  addEventListener('resize', measure);

  document.addEventListener('keydown', function(e){
    if(e.key === 'r' || e.key === 'R') restart();
    if(e.key === 'f' || e.key === 'F'){
      if(document.fullscreenElement) document.exitFullscreen();
      else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });
})();
</script>
</body>
</html>
